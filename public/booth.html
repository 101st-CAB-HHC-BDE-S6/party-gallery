<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the Hofers Christmas 2026 — Photo Booth</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:#FAF6F0;color:#1B4332;text-align:center;font-family:Georgia,serif}
  h1{font-style:italic;font-size:clamp(22px,6vw,32px);margin-top:0}
  .card{max-width:560px;margin:12px auto;padding:clamp(18px,5vw,28px);background:#fff;
    border:2px solid #8B0000;border-radius:18px;box-shadow:0 8px 26px #1b43321a}
  .card p{line-height:1.5}
  .pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .pill{border:2px solid #1B4332;background:#fff;color:#1B4332;border-radius:999px;padding:8px 18px;cursor:pointer}
  .pill.active{background:#1B4332;color:#fff}
  button.main{background:#8B0000;color:#fff;border:0;border-radius:999px;padding:14px 24px;
    font:inherit;font-size:18px;cursor:pointer;margin:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .stage{position:relative;width:min(92vw,640px);max-width:100%;margin:12px auto;aspect-ratio:520 / 700;
    border:4px solid #1B4332;border-radius:16px;overflow:hidden;background:#000}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);border:0}
  #caption{width:min(92vw,520px);padding:12px 14px;border:2px solid #1B4332;border-radius:12px;
    font:16px Georgia,serif;color:#1B4332;background:#fff}
  #count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:38vw;color:#fff;
    background:rgba(0,0,0,.45);z-index:10}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11}
  #flash.on{opacity:1}
  #result img{width:min(92vw,420px);height:auto;border:2px solid #1B4332}
  #albumBack{position:fixed;top:12px;left:12px;z-index:20;background:#1B4332;color:#fff;
    border:1px solid #FAF6F0;border-radius:999px;padding:10px 16px;text-decoration:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<a id="albumBack" href="gallery.html" hidden>Back to Album</a>

<section id="welcome" class="card">
  <h1>the Hofers Christmas 2026 Photo Booth</h1>
  <p>Your camera stays off until you choose to open it. Tap below, then choose Allow when your browser asks.</p>
  <button class="main" id="openCamera" type="button">Tap to Open Camera (Then Tap 'Allow')</button>
  <p id="cameraError" role="status" hidden></p>
</section>

<main id="cameraTools" hidden>
  <p>Layout</p>
  <div class="pills" id="layouts"></div>
  <p>Filter</p>
  <div class="pills" id="filters"></div>
  <div class="stage" id="stage">
    <video id="cam" autoplay playsinline muted></video>
  </div>
  <p><input type="text" id="caption" maxlength="40" placeholder="Optional caption (e.g. Merry Christmas from the Hofers!)"></p>
  <div id="count"></div>
  <div id="flash"></div>
  <button class="main" id="start" type="button" disabled>Start Photo Booth</button>
  <div id="result" hidden>
    <img id="finalImg" alt="Your framed photo booth picture">
    <p><strong>Hold Image to Save to Phone</strong></p>
    <button class="main" id="again" type="button">Take Another</button>
  </div>
</main>
<p id="status" role="status" aria-live="polite"></p>

<script src="backend.js"></script>
<script>
const kioskMode = new URLSearchParams(location.search).get('kiosk') === '1';
const albumUrl = 'gallery.html';
let idleTimer = null;
let returnTimer = null;
const CELLS = {
  '1': { width: 1060, height: 1420 },
  '2': { width: 1060, height: 700 },
  '4': { width: 520, height: 700 },
  '6': { width: 520, height: 460 },
};
let layout = '4';
let filter = 'color';
let stream = null;
let capturing = false;
const video = document.getElementById('cam');
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const startButton = document.getElementById('start');
const openCameraButton = document.getElementById('openCamera');
const cameraTools = document.getElementById('cameraTools');
const welcome = document.getElementById('welcome');

function returnToAlbum() {
  location.replace(albumUrl);
}
function resetInactivityTimer() {
  if (!kioskMode) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(returnToAlbum, 60000);
}
function scheduleKioskReturn(delay) {
  if (!kioskMode) return;
  clearTimeout(idleTimer);
  clearTimeout(returnTimer);
  returnTimer = setTimeout(returnToAlbum, delay);
}
function pills(container, values, current, onPick) {
  container.replaceChildren();
  values.forEach(([value, label]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pill' + (value === current ? ' active' : '');
    button.textContent = label;
    button.addEventListener('click', () => onPick(value));
    container.appendChild(button);
  });
}
function renderStageAspect() {
  const cell = CELLS[layout];
  stage.style.aspectRatio = `${cell.width} / ${cell.height}`;
}
async function loadConfig() {
  let cfg = {
    layouts: { '1': true, '2': true, '4': true, '6': true },
    filters: { color: true, bw: true },
  };
  try {
    const response = await fetch(await partyGalleryApi('/api/config'), { cache: 'no-store' });
    if (!response.ok) throw new Error('Event settings are unavailable.');
    cfg = { ...cfg, ...await response.json() };
  } catch {
    statusEl.textContent = 'Could not load event settings. You can still open the camera.';
  }
  const layouts = Object.keys(cfg.layouts || {}).filter((key) => cfg.layouts[key] && CELLS[key]);
  if (!layouts.includes(layout)) layout = layouts[0] || '1';
  const filters = [];
  if (cfg.filters?.color) filters.push(['color', 'Color']);
  if (cfg.filters?.bw) filters.push(['bw', 'B&W']);
  if (!filters.some(([value]) => value === filter)) filter = filters[0]?.[0] || 'color';
  loadConfigPills(layouts, filters);
}
function loadConfigPills(layouts, filters) {
  pills(document.getElementById('layouts'), layouts.map((key) => [
    key, `${key} ${key === '1' ? 'photo' : 'photos'}`,
  ]), layout, (value) => {
    layout = value;
    loadConfigPills(layouts, filters);
  });
  pills(document.getElementById('filters'), filters, filter, (value) => {
    filter = value;
    loadConfigPills(layouts, filters);
  });
  renderStageAspect();
}
async function startCamera() {
  openCameraButton.disabled = true;
  document.getElementById('cameraError').hidden = true;
  statusEl.textContent = 'Opening the camera…';
  if (!navigator.mediaDevices?.getUserMedia) {
    document.getElementById('cameraError').textContent =
      'This browser cannot open the camera here. Use the secure Photo Booth link or Share Photos.';
    document.getElementById('cameraError').hidden = false;
    openCameraButton.disabled = false;
    statusEl.textContent = '';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    welcome.hidden = true;
    cameraTools.hidden = false;
    statusEl.textContent = '';
  } catch {
    stream?.getTracks().forEach((track) => track.stop());
    stream = null;
    document.getElementById('cameraError').textContent =
      "Camera access was not granted. Check your browser's permission, then tap the button to try again.";
    document.getElementById('cameraError').hidden = false;
    statusEl.textContent = '';
  } finally {
    openCameraButton.disabled = false;
  }
}
video.addEventListener('loadedmetadata', () => {
  startButton.disabled = capturing || video.videoWidth <= 0;
});
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function countdown() {
  const element = document.getElementById('count');
  element.style.display = 'flex';
  for (const number of ['3', '2', '1']) {
    element.textContent = number;
    await sleep(800);
  }
  element.style.display = 'none';
}
function capture() {
  if (!video.videoWidth || !video.videoHeight) throw new Error('Camera is not ready');
  const cell = CELLS[layout];
  const canvas = document.createElement('canvas');
  canvas.width = cell.width;
  canvas.height = cell.height;
  const context = canvas.getContext('2d');
  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;
  const targetRatio = cell.width / cell.height;
  const sourceRatio = videoWidth / videoHeight;
  let sourceWidth;
  let sourceHeight;
  let sourceX;
  let sourceY;
  if (sourceRatio > targetRatio) {
    sourceHeight = videoHeight;
    sourceWidth = videoHeight * targetRatio;
    sourceX = (videoWidth - sourceWidth) / 2;
    sourceY = 0;
  } else {
    sourceWidth = videoWidth;
    sourceHeight = videoWidth / targetRatio;
    sourceX = 0;
    sourceY = (videoHeight - sourceHeight) / 2;
  }
  context.translate(canvas.width, 0);
  context.scale(-1, 1);
  context.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.92);
}
startButton.addEventListener('click', async () => {
  if (!stream) {
    welcome.hidden = false;
    cameraTools.hidden = true;
    return;
  }
  capturing = true;
  startButton.disabled = true;
  document.getElementById('result').hidden = true;
  try {
    const shots = [];
    const count = Number(layout);
    for (let index = 0; index < count; index += 1) {
      statusEl.textContent = `Photo ${index + 1} of ${count} — get ready!`;
      await countdown();
      const flash = document.getElementById('flash');
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 120);
      shots.push(capture());
      await sleep(400);
    }
    statusEl.textContent = 'Making your framed picture…';
    const response = await fetch(await partyGalleryApi('/api/upload-booth'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        images: shots,
        layout,
        filter,
        caption: document.getElementById('caption').value,
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.url) throw new Error(data.error || 'Upload failed.');
    document.getElementById('finalImg').src =
      new URL(data.url, await partyGalleryApi('/api/upload-booth')).href;
    document.getElementById('result').hidden = false;
    statusEl.textContent = 'Done — it is on the big screen too!';
    scheduleKioskReturn(15000);
  } catch (error) {
    statusEl.textContent = error.message === 'Camera is not ready'
      ? 'The camera is still starting — please try again.'
      : 'Something went wrong making that one — please check your connection and try again.';
  } finally {
    capturing = false;
    startButton.disabled = !video.videoWidth;
  }
});
document.getElementById('again').addEventListener('click', () => {
  clearTimeout(returnTimer);
  document.getElementById('result').hidden = true;
  statusEl.textContent = '';
  resetInactivityTimer();
});
openCameraButton.addEventListener('click', startCamera);
if (kioskMode) {
  document.getElementById('albumBack').hidden = false;
  for (const eventName of ['pointerdown', 'touchstart', 'keydown']) {
    document.addEventListener(eventName, resetInactivityTimer, { passive: true });
  }
  resetInactivityTimer();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  stream?.getTracks().forEach((track) => track.stop());
  stream = null;
  video.srcObject = null;
  startButton.disabled = true;
  cameraTools.hidden = true;
  welcome.hidden = false;
  statusEl.textContent = 'Camera paused. Tap the button again when you are ready.';
});
loadConfig();
</script>
</body>
</html>
