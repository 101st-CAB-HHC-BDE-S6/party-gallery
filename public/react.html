<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send a Christmas Cheer</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:24px;background:#FAF6F0;color:#1B4332;
    font-family:Georgia,serif;text-align:center;display:grid;place-items:center}
  main{width:min(620px,100%);padding:clamp(20px,5vw,40px);background:#fff;
    border:2px solid #8B0000;border-radius:20px;box-shadow:0 12px 36px #1b433233}
  h1{font-style:italic}
  .choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0}
  button{font-size:clamp(32px,10vw,54px);padding:10px 4px;background:#FAF6F0;
    border:2px solid #1B4332;border-radius:16px;cursor:pointer}
  button:active{transform:scale(.94);background:#f4b942}
  button:disabled{opacity:.55}
  #status{min-height:1.5em}
  a{display:inline-block;margin-top:12px;color:#8B0000}
  @media(max-width:420px){.choices{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
  <h1 id="title">Send a little cheer!</h1>
  <p>Tap an emoji to send it floating across the big screen.</p>
  <div class="choices" id="choices" aria-label="Choose a reaction"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <a href="/gallery.html">Back to the album</a>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const emojis = ['❤️', '😂', '🎄', '🎅', '✨', '🥳', '👏', '🎉', '😍', '🤶'];
const statusEl = document.getElementById('status');
fetch('/api/config', { cache: 'no-store' })
  .then((response) => response.ok ? response.json() : Promise.reject(new Error('Configuration unavailable')))
  .then((config) => { document.getElementById('title').textContent = config.eventTitle || 'Send a little cheer!'; })
  .catch(() => { statusEl.textContent = 'Could not load event details; reactions are still available.'; });

emojis.forEach((emoji) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = emoji;
  button.setAttribute('aria-label', `Send ${emoji}`);
  button.addEventListener('click', async () => {
    button.disabled = true;
    statusEl.textContent = 'Sending…';
    try {
      const response = await fetch('/api/react', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emoji }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Could not send reaction.');
      statusEl.textContent = 'Your cheer is on the big screen!';
    } catch (error) {
      statusEl.textContent = error.message || 'Check your connection and try again.';
    } finally {
      button.disabled = false;
    }
  });
  document.getElementById('choices').appendChild(button);
});
</script>
</body>
</html>
