<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the Hofers Christmas 2026 — Print Strips</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#FAF6F0;color:#1B4332;padding:20px;text-align:center}
  h1{font-style:italic;font-size:22px}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}
  button{background:#8B0000;color:#fff;border:0;border-radius:999px;padding:11px 22px;font:inherit;cursor:pointer}
  button.ghost{background:#fff;color:#1B4332;border:2px solid #1B4332}
  button:disabled{opacity:.5;cursor:not-allowed}
  #grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:820px;margin:0 auto}
  #grid figure{margin:0;border:1px solid #d8d0c4;padding:6px;background:#fff}
  #grid img{width:100%;display:block}
  #grid figcaption{font-size:11px;color:#8a8a8a;padding-top:4px}
  #note{font-size:14px;color:#8a8a8a}
  @media(max-width:520px){#grid{grid-template-columns:minmax(0,1fr)}}
  @media print{
    body{padding:0;background:#fff}
    h1,#note,.bar{display:none}
    #grid{max-width:none;gap:4mm;grid-template-columns:repeat(2,minmax(0,1fr))}
    #grid figure{border:0;padding:0;break-inside:avoid;page-break-inside:avoid}
    #grid figcaption{display:none}
    @page{margin:10mm}
  }
</style>
</head>
<body>
<h1>the Hofers Christmas 2026 — Print Strips</h1>
<p id="note">The eight most recent photo booth strips. Tap Print, then choose your printer or Save as PDF.</p>
<div class="bar">
  <button id="print" type="button">Print</button>
  <button class="ghost" type="button" onclick="location.href='/gallery.html'">Back to the wall</button>
</div>
<div id="grid"></div>
<script>
async function load() {
  const grid = document.getElementById('grid');
  try {
    const response = await fetch('/api/photos', { cache: 'no-store' });
    if (!response.ok) throw new Error('Photo list unavailable.');
    const photos = await response.json();
    const strips = (Array.isArray(photos) ? photos : [])
      .filter((photo) => typeof photo.name === 'string' && photo.name.startsWith('booth-'))
      .slice(0, 8);

    if (!strips.length) {
      document.getElementById('note').textContent = 'No photo booth strips yet — take some first.';
      document.getElementById('print').disabled = true;
      return;
    }

    strips.forEach((photo) => {
      const figure = document.createElement('figure');
      const image = document.createElement('img');
      image.src = photo.url;
      image.alt = 'Photo booth strip';
      image.loading = 'lazy';
      const caption = document.createElement('figcaption');
      caption.textContent = new Date(Number(photo.name.split('-')[1]) || Date.now()).toLocaleTimeString();
      figure.append(image, caption);
      grid.appendChild(figure);
    });
  } catch (error) {
    document.getElementById('note').textContent = error.message || 'Could not load photo booth strips.';
    document.getElementById('print').disabled = true;
  }
}
document.getElementById('print').addEventListener('click', () => window.print());
load();
</script>
</body>
</html>
