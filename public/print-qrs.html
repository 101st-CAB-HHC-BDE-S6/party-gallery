<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the Hofers Christmas 2026 — Print QR Codes</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#FAF6F0;color:#1B4332;text-align:center;padding:28px}
  h1{font-style:italic}
  .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
  .card{background:#fff;border:3px solid #1B4332;outline:2px solid #8B0000;border-radius:16px;
    padding:28px;width:320px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .card img{width:260px;height:260px}
  .url{word-break:break-all;font-size:14px;color:#333}
  @media print{
    body{background:#fff;padding:0}
    .card{box-shadow:none;page-break-inside:avoid}
  }
</style>
</head>
<body>
<h1>the Hofers Christmas 2026</h1>
<p>Print this sheet and set it out where guests can scan it.</p>
<div class="row">
  <div class="card">
    <h2>Share Your Photos</h2>
    <img src="/qr/upload-qr.png" alt="Upload QR code" onerror="this.style.display='none'">
    <p>Scan to upload photos from your phone to the big screen.</p>
    <p class="url" id="uploadUrl"></p>
  </div>
  <div class="card">
    <h2>Photo Booth</h2>
    <img src="/qr/booth-qr.png" alt="Photo booth QR code" onerror="this.style.display='none'">
    <p>Scan to take framed photo-booth pictures.</p>
    <p class="url" id="boothUrl"></p>
  </div>
</div>
<script>
fetch('/api/config').then(r => r.json()).then(cfg => {
  const base = cfg.publicUrl || location.origin;
  document.getElementById('uploadUrl').textContent = base + '/upload.html';
  document.getElementById('boothUrl').textContent = base + '/booth.html';
}).catch(() => {});
</script>
</body>
</html>
