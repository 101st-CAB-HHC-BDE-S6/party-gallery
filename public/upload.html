<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the Hofers Christmas 2026 — Share Your Photos</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#FAF6F0;color:#1B4332;text-align:center;padding:24px}
  h1{font-style:italic}
  .box{background:#fff;border:2px solid #1B4332;border-radius:16px;padding:24px;max-width:520px;margin:20px auto}
  button{background:#8B0000;color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:18px;cursor:pointer}
  #barWrap{background:#e5ded2;border-radius:999px;height:18px;overflow:hidden;margin:16px 0}
  #bar{background:#1B4332;height:100%;width:0%}
  #summary{margin:16px 0;font-weight:bold}
  #summary.ok{color:#1B4332}#summary.partial{color:#8B0000}
  input[type=file]{font-size:16px;margin:16px 0}
</style>
</head>
<body>
<h1>the Hofers Christmas 2026 — Share Your Photos</h1>
<div class="box">
  <p>Pick photos from your phone and they'll appear on the big screen.</p>
  <input type="file" id="picker" accept="image/*" multiple>
  <div id="barWrap" hidden><div id="bar"></div></div>
  <p id="status"></p>
  <p id="summary" role="status"></p>
  <button id="again" type="button" hidden onclick="location.reload()">Add More Photos</button>
</div>

<script>
const picker = document.getElementById('picker');
const statusEl = document.getElementById('status');
const summaryEl = document.getElementById('summary');
const barWrap = document.getElementById('barWrap');
const bar = document.getElementById('bar');

async function transcode(file) {
  // Scale longest edge to <= 2400px and re-encode as JPEG 0.90.
  // If decoding fails (e.g. HEIC in a browser without HEIC support),
  // return the original File untouched for the server to evaluate.
  try {
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch {
      bmp = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    const w = bmp.width, h = bmp.height;
    if (!w || !h) throw new Error('no dimensions');
    const scale = Math.min(1, 2400 / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.90));
    if (!blob) throw new Error('toBlob failed');
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch {
    return file;
  }
}

picker.addEventListener('change', async () => {
  const originals = [...picker.files];
  if (!originals.length) return;
  summaryEl.textContent = '';
  statusEl.textContent = 'Preparing photos…';
  const prepared = [];
  for (const f of originals) prepared.push(await transcode(f));

  const form = new FormData();
  prepared.forEach((f) => form.append('photos', f, f.name));

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload-general');
  barWrap.hidden = false;
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      bar.style.width = pct + '%';
      statusEl.textContent = `Uploading… ${pct}%`;
    }
  };
  xhr.onload = () => {
    barWrap.hidden = true;
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    const saved = data.saved || [];
    const skipped = data.skipped || [];
    const total = originals.length;
    if (xhr.status >= 200 && xhr.status < 300) {
      if (skipped.length) {
        summaryEl.className = 'partial';
        summaryEl.textContent = `${saved.length} of ${total} uploaded — ${skipped.length} unsupported format skipped: ${skipped.join(', ')}`;
      } else {
        summaryEl.className = 'ok';
        summaryEl.textContent = `${saved.length} of ${total} uploaded!`;
      }
      statusEl.textContent = 'They should be on the big screen now.';
    } else {
      summaryEl.className = 'partial';
      summaryEl.textContent = data.error || 'Upload failed — please try again.';
      statusEl.textContent = '';
    }
    document.getElementById('again').hidden = false;
  };
  xhr.onerror = () => {
    barWrap.hidden = true;
    summaryEl.className = 'partial';
    summaryEl.textContent = 'Upload failed — check your connection and try again.';
  };
  xhr.send(form);
});
</script>
</body>
</html>
